name: Release

# Builds and publishes multi-platform installers to a GitHub Release.
# Trigger by pushing a version tag (e.g. `git tag v0.0.1 && git push origin v0.0.1`),
# or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# The repository environment disables the checksum database; point it back at
# the real one so the Go toolchain can verify downloaded modules/toolchains.
env:
  GOSUMDB: sum.golang.org

jobs:
  # ---------------------------------------------------------------------------
  # macOS — universal (arm64 + amd64) .app bundle and .dmg
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (universal dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build universal app bundle
        run: wails3 task darwin:package:universal

      - name: Create DMG
        run: wails3 task darwin:create:dmg

      - name: Zip .app bundle
        run: ditto -c -k --sequesterRsrc --keepParent bin/worktools.app bin/worktools-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            bin/worktools.dmg
            bin/worktools-macos-universal.zip

  # ---------------------------------------------------------------------------
  # Linux — AppImage, .deb and .rpm (amd64, CGO-free purego build)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (appimage, deb, rpm)
    runs-on: ubuntu-latest
    env:
      # Run AppImage tooling without FUSE (not available on CI runners).
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # wails3 and the linux build link against GTK4/WebKitGTK, so the dev
      # headers must be present even for the CGO-free purego packaging path.
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libfuse2 file wget

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # nfpm reads the maintainer from the git identity.
      - name: Configure git identity for packaging metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "GIT_COMMITTER_NAME=github-actions[bot]"
            echo "GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"

      - name: Create .deb
        run: wails3 task linux:create:deb EXTRA_TAGS=purego

      - name: Create .rpm
        run: wails3 task linux:create:rpm EXTRA_TAGS=purego

      # AppImage's GTK auto-detection inspects `ldd` on the binary, so it needs
      # a dynamically linked (CGO) build rather than the purego one.
      - name: Create AppImage
        continue-on-error: true
        run: wails3 task linux:create:appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: warn
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage

  # ---------------------------------------------------------------------------
  # Windows — NSIS installer (amd64, CGO-free)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (nsis installer)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install NSIS (makensis)
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$env:GITHUB_PATH"

      - name: Build NSIS installer
        run: wails3 task windows:package

      - name: Build ARM64 installer
        continue-on-error: true
        run: wails3 task windows:package ARCH=arm64

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: warn
          path: |
            bin/*-installer.exe
            bin/worktools.exe

  # ---------------------------------------------------------------------------
  # Android — release APK (arm64) and AAB
  # ---------------------------------------------------------------------------
  android:
    name: Android (apk, aab)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;29.0.14206865"

      # wails3's GTK bindings must compile, so GTK4/WebKitGTK headers are
      # required here too (the android build only needs the CLI, not the libs).
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: wails3 task android:package

      - name: Build release AAB
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: wails3 task android:bundle

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: warn
          path: |
            bin/worktools.apk
            bin/worktools.aab

  # ---------------------------------------------------------------------------
  # Publish — collect every artifact and attach it to the GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [macos, linux, windows, android]
    # Publish whatever succeeded, even if one platform job failed.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -laR dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: WorkTools ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**
